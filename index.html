const Store = (() => {
  if (LIVE) {
    firebase.initializeApp(CONFIG);
    const db = firebase.database(); let off = 0;
    db.ref(".info/serverTimeOffset").on("value", s => off = s.val() || 0);
    const r = p => db.ref("rooms/" + ROOM + (p ? "/" + p : ""));
    return { on:(p,cb)=>r(p).on("value", s=>cb(s.val())), set:(p,v)=>r(p).set(v), update:(p,v)=>r(p).update(v), now:()=>Date.now()+off };
  }
  const key = () => "fbz_room_" + ROOM; const subs = [];
  let bc = null; try { bc = ("BroadcastChannel" in window) ? new BroadcastChannel("fbz") : null; } catch(e) {}
  let mem = null;
  const load = () => { try { const v = localStorage.getItem(key()); if (v != null) return JSON.parse(v); } catch(e) {} return mem ? JSON.parse(JSON.stringify(mem)) : {}; };
  const get = (o,p) => p ? p.split("/").reduce((a,k)=> a==null ? null : a[k], o) : o;
  const put = (o,p,v) => { const ks=p.split("/"); let a=o; ks.slice(0,-1).forEach(k=>{ if(typeof a[k]!=="object"||a[k]===null) a[k]={}; a=a[k]; }); const last=ks[ks.length-1]; if(v===null) delete a[last]; else a[last]=v; };
  const fire = () => { const o = load(); subs.forEach(s => s.cb(get(o,s.p) ?? null)); };
  const save = o => { mem = o; try { localStorage.setItem(key(), JSON.stringify(o)); } catch(e) {} try { bc && bc.postMessage(ROOM); } catch(e) {} fire(); };
  if (bc) bc.onmessage = e => { if (e.data === ROOM) fire(); };
  addEventListener("storage", e => { if (e.key === key()) fire(); });
  return {
    on:(p,cb)=>{ subs.push({p,cb}); setTimeout(()=>cb(get(load(),p) ?? null)); },
    set:(p,v)=>{ const o=load(); if(!p){ save(v||{}); return; } put(o,p,v); save(o); },
    update:(p,v)=>{ const o=load(); Object.entries(v).forEach(([k,x])=>put(o,(p?p+"/":"")+k,x)); save(o); },
    now:()=>Date.now()
  };
})();

function money(p, step = 5, r = RND) {
  const L = r === 2 ? "locked2" : "locked", A = r === 2 ? "alloc2" : "alloc", Cs = r === 2 ? "cash2" : "cash", FF = r === 2 ? F2 : F;

/* ---- slayd animatsiyalari (canvas) ---- */
function startAnim(kind) {
  stopAnim(); const cv = $("#sc"); if (!cv) return; const x = cv.getContext("2d"); let t = 0, W, H;
  const fit = () => { W = cv.width = cv.clientWidth*devicePixelRatio; H = cv.height = cv.clientHeight*devicePixelRatio; }; fit();
  const dpr = devicePixelRatio;
  let P = [], n = 0;
  const N = {Miami:[-80.2,25.8],London:[-0.1,51.5],Istanbul:[29,41],Dubai:[55.3,25.2],Almaty:[76.9,43.2],Tashkent:[69.2,41.3]};
  const RT = [["Miami","Tashkent"],["Miami","London"],["London","Istanbul"],["Istanbul","Tashkent"],["Dubai","Tashkent"],["Almaty","Tashkent"],["London","Dubai"]];
  const pos = c => [W*.07+(N[c][0]+95)/180*W*.86, H*.16+(62-N[c][1])/47*H*.66];
  function frame() {
    t += .008; x.clearRect(0,0,W,H);
    if (kind === "routes") {
      x.strokeStyle="rgba(180,193,224,.12)"; x.lineWidth=dpr;
      for (let lo=-90; lo<=90; lo+=15) { const px=W*.07+(lo+95)/180*W*.86; x.beginPath(); x.moveTo(px,H*.06); x.lineTo(px,H*.94); x.stroke(); }
      for (let la=20; la<=60; la+=10) { const py=H*.16+(62-la)/47*H*.66; x.beginPath(); x.moveTo(W*.03,py); x.lineTo(W*.97,py); x.stroke(); }
      RT.forEach((r,i)=>{ const a=pos(r[0]), b=pos(r[1]), mx=(a[0]+b[0])/2, my=Math.min(a[1],b[1])-Math.abs(a[0]-b[0])*.25, hq=r[1]==="Tashkent";
        x.strokeStyle=hq?"rgba(255,200,69,.5)":"rgba(46,230,214,.35)"; x.lineWidth=2*dpr; x.beginPath(); x.moveTo(a[0],a[1]); x.quadraticCurveTo(mx,my,b[0],b[1]); x.stroke();
        for (let k=0;k<3;k++){ const u=(t*.6+i*.13+k/3)%1, px=(1-u)*(1-u)*a[0]+2*(1-u)*u*mx+u*u*b[0], py=(1-u)*(1-u)*a[1]+2*(1-u)*u*my+u*u*b[1];
          x.fillStyle=hq?"#FFC845":"#2EE6D6"; x.shadowBlur=14; x.shadowColor=x.fillStyle; x.beginPath(); x.arc(px,py,4*dpr,0,7); x.fill(); x.shadowBlur=0; } });
      Object.keys(N).forEach(c=>{ const p=pos(c), hq=c==="Tashkent", pl=1+.45*Math.sin(t*6);
        x.strokeStyle=hq?"rgba(255,200,69,.8)":"rgba(246,248,255,.35)"; x.lineWidth=1.5*dpr; x.beginPath(); x.arc(p[0],p[1],(hq?16:10)*pl*dpr,0,7); x.stroke();
        x.fillStyle=hq?"#FFC845":"#F6F8FF"; x.beginPath(); x.arc(p[0],p[1],(hq?8:5)*dpr,0,7); x.fill();
        x.font=(hq?"700 ":"600 ")+Math.round((hq?24:20)*dpr)+"px JetBrains Mono,monospace"; x.textAlign="center"; x.fillStyle=hq?"#FFC845":"#B4C1E0"; x.fillText(c.toUpperCase(), p[0], p[1]+(c==="Almaty"?-22:38)*dpr); });
    } else if (kind === "flow") {
      n++; const y1=H*.33, y2=H*.67; x.lineWidth=dpr;
      x.strokeStyle="rgba(46,230,214,.4)"; x.beginPath(); x.moveTo(0,y1); x.lineTo(W,y1); x.stroke();
      x.strokeStyle="rgba(255,200,69,.4)"; x.beginPath(); x.moveTo(0,y2); x.lineTo(W,y2); x.stroke();
      if (n%20===0) { P.push({l:0,x:0}); P.push({l:1,x:W}); }
      P.forEach(p=>{ if(p.l===0){ p.x+=3*dpr; x.fillStyle="#2EE6D6"; x.shadowBlur=12; x.shadowColor="#2EE6D6"; x.fillRect(p.x-8*dpr,y1-8*dpr,16*dpr,16*dpr); } else { p.x-=3*dpr; x.fillStyle="#FFC845"; x.shadowBlur=12; x.shadowColor="#FFC845"; x.beginPath(); x.arc(p.x,y2,9*dpr,0,7); x.fill(); } });
      x.shadowBlur=0; P = P.filter(p=>p.x>-30 && p.x<W+30);
    }
    anim = requestAnimationFrame(frame);
  }
  frame();
}
function stopAnim(){ if (anim) cancelAnimationFrame(anim); anim = null; }

  (function f(){ t++; acc++; if (acc>50) { acc=0; C.push(mk()); C.shift(); } x.clearRect(0,0,W,H);
    let mn=1e9, mx=-1e9; C.forEach(k=>{ mn=Math.min(mn,k[2]); mx=Math.max(mx,k[1]); });
    const cw=W/C.length, Y=v=>H*.25+(mx-v)/(mx-mn)*H*.55, off=(acc/50)*cw;
    C.forEach((k,i)=>{ const cx=i*cw-off+cw/2, up=k[3]>=k[0], col=up?"255,200,69":"46,230,214"; x.strokeStyle=`rgba(${col},.12)`; x.beginPath(); x.moveTo(cx,Y(k[1])); x.lineTo(cx,Y(k[2])); x.stroke();
      x.fillStyle=`rgba(${col},.09)`; const y1=Y(Math.max(k[0],k[3])), y2=Y(Math.min(k[0],k[3])); x.fillRect(cx-cw*.3,y1,cw*.6,Math.max(2,y2-y1)); });
    requestAnimationFrame(f); })();
}

function hostRender(room) {
  R = room || {}; const st = R.state || {slide:0}; const ps = list(R.players); const c = cur(st); RND = c.r;
  const isLive = !!(c.s.live || c.s.q != null);
  const sig = c.i + "|" + c.phase + "|" + (c.s.live==="events" ? c.step : "") + "|" + (c.open?1:0);
  if (sig !== hostSig) {
    hostSig = sig; stopAnim();
    if (c.s.q != null) { const L = LIVEV[c.phase==="qwait" ? "quiz" : c.phase]; app.innerHTML = L.view(c, st, ps); L.mount && L.mount(c, st, ps); }
    else if (c.s.live) { const L = LIVEV[c.s.live]; app.innerHTML = L.view(c, st, ps); if (c.s.live==="lobby") MOUNT.join(); L.mount && L.mount(c, st, ps); }
    else { app.innerHTML = VIEWS[c.s.id](); MOUNT[c.s.id] && MOUNT[c.s.id](); if (c.s.anim) startAnim(c.s.anim); }
    const locked = (c.s.live === "invest" && !c.open) || c.phase === "qwait";
    if (locked) { const host = c.phase === "qwait" ? $(".opts") : $(".frow"); if (host) { host.style.position = "relative";
        const ov = document.createElement("div"); ov.className = "lockov" + (c.phase === "qwait" ? "" : " slim"); ov.innerHTML = `<div class="lk">🔒</div><div>${c.phase==="qwait" ? "Read the question · Savolni o‘qing" : "Read the cards · Kartochkalarni o‘qing"}</div><div class="mu" style="font-size:1.5rem;font-weight:600">Press START to unlock phones · Telefonlar START bosilgach ochiladi</div>`; host.appendChild(ov); }
      const nb = $(".nextbtn"); if (nb) nb.textContent = "🔓 START"; }
    const mq = $("#mqr"); if (mq) { try { new QRCode(mq, {text: joinURL(), width: 64, height: 64, colorDark:"#121A35", colorLight:"#ffffff"}); } catch(e) {} }
  }
  if (!isLive) document.querySelectorAll("[data-s]").forEach(el => el.classList.toggle("show", c.step >= +el.dataset.s));
  const L = isLive ? LIVEV[c.s.q != null ? (c.phase==="qwait" ? "quiz" : c.phase) : c.s.live] : null; L && L.update && L.update(c, st, ps);
  const pcount = $("#pcount"); if (pcount) pcount.textContent = ps.length;
  if (!LIVE) botAct(c);
}
function setState(s) { Store.set("state", s); }
/* ---- DEMO o'yinchilar (mashq va oldindan ko'rish uchun) ---- */
const BOTS = ["Aziz","Malika","Bobur","Dilnoza","Jasur","Madina","Sardor","Nilufar","Otabek","Shahzoda","Javohir","Kamola"];
let botDone = {};
function addBots() { const up = {}; BOTS.forEach((n,i) => up["bot"+i] = {name:n, joined:Store.now()+i, bot:true}); Store.update("players", up); }
function botAct(c) {
  const bots = list(R.players).filter(p=>p.bot); if (!bots.length) return; if (c.phase === "invest" && !c.open) return; const key = c.i + "|" + c.phase + "|" + (c.open?1:0); if (botDone[key]) return; botDone[key] = 1;
  if (c.phase === "invest") { const r2 = c.r === 2, FF = r2 ? F2 : F; bots.forEach((p,i) => { if (p[r2?"locked2":"locked"]) return; setTimeout(() => {
      const greedy = Math.random() < (r2 ? .12 : .55); const smart = r2 && Math.random() < .7;
      const picks = greedy ? [FF[r2?4:0].id] : smart ? ["fix","bread"].concat(Math.random()<.4?[FF[Math.floor(Math.random()*5)].id]:[]) : (r2 ? FF.map(f=>f.id) : ["burger","coffee","fit","burger","pizza","smart"]).sort(()=>Math.random()-.5).slice(0, 1+Math.floor(Math.random()*3));
      const alloc = {}; FF.forEach(f=>alloc[f.id]=0); let cash = 0;
      for (let k=0;k<10;k++) { if (!greedy && Math.random() < .08) cash += 10; else alloc[picks[Math.floor(Math.random()*picks.length)]] += 10; }
      Store.update("players/"+p.id, r2 ? {alloc2:alloc, cash2:cash, locked2:true} : {alloc, cash, locked:true}); }, 800 + i*900 + Math.random()*800); }); }
  if (c.phase === "quiz") bots.forEach((p) => { setTimeout(() => { const st = R.state||{}; const cc = cur(st); if (cc.phase !== "quiz" || cc.q !== c.q) return;
      const a = Math.random() < .65 ? Q[c.q].a : Math.floor(Math.random()*4); Store.set(`players/${p.id}/answers/${c.q}`, {a, t:Store.now()}); }, 1500 + Math.random()*13000); });
}
function goTo(i, back) {
  const st = R.state || {}; i = Math.max(0, Math.min(SLIDES.length-1, i)); const s = SLIDES[i];
  const ns = {...st, slide:i, step: back && s.steps ? s.steps : 0, sub: back ? "r" : "w", open: !!back};
  if (s.q != null && !back) revealing = -1;
  if (s.q != null && back && at(st.qStarts, s.q) == null) ns.sub = "w";
  setState(ns);
}
function hostNext() {
  const st = R.state || {}; const c = cur(st);
  if (c.s.live === "invest" && !c.open) return setState({...st, open:true});
  if (c.s.q != null && c.phase === "qwait") { revealing = -1; const qStarts = {...(st.qStarts||{})}; qStarts[c.q] = Store.now(); return setState({...st, sub:"q", qStarts}); }
  if (c.s.steps && c.step < c.s.steps) return setState({...st, step: c.step+1});
  if (c.s.q != null && c.phase === "quiz") return hostReveal(true);
  if (c.i < SLIDES.length-1) goTo(c.i+1); else confetti(300);
}
function hostPrev() { const c = cur(R.state); if (c.i > 0) goTo(c.i-1, true); }
let revealing = -1;
function hostReveal() { const st = R.state || {}; const c = cur(st); if (c.phase !== "quiz" || revealing === c.q) return; revealing = c.q; setState({...st, sub:"r"}); }
let resetArm = 0;
function hostReset(btn) { const b = btn || document.activeElement; if (Date.now() - resetArm > 3000) { resetArm = Date.now(); if (b && b.tagName==="BUTTON") { b.textContent = "Tap again to reset"; setTimeout(()=>{ b.textContent = "↺"; }, 3000); } return; }
  resetArm = 0; revealing=-1; hostSig=""; botDone = {}; Store.set("", {state:{slide:0}}); }

/* =========================================================================
   6) TALABA EKRANI (TELEFON)
   ========================================================================= */
let me = null, pSig = "", DRAFT = null, DRAFT_R = 0;
function pShell(inner) {
  return `<div class="P"><div class="P-top"><span class="mono">ROOM ${ROOM}</span>${LIVE?'':'<span class="demo">DEMO</span>'}<span>${me?esc(me.name):""}</span></div>${inner}</div>`;
}
function joinView() {
  return pShell(`<div class="rise" style="padding-top:20px"><div style="font-size:54px">💼</div><h1 style="margin-top:8px">Franchise <span class="gold">Bazaar</span></h1>
   <div class="sub">Enter your name to join the game · O‘yinga qo‘shilish uchun ismingizni yozing</div>
   ${ROOM ? "" : `<input id="rm" class="inp mono" inputmode="numeric" placeholder="Room code" maxlength="6">`}
   <input id="nm" class="inp" placeholder="Your name · Ismingiz" maxlength="18" autocomplete="off">
   <button class="btn" onclick="doJoin()">Join · Qo‘shilish →</button>
   <div id="pres" style="margin-top:40px;text-align:center"><button style="background:none;color:var(--mu);font-size:12px;text-decoration:underline" onclick="presForm()">Presenter</button></div></div>`);
}
function presForm() { $("#pres").innerHTML = `<input id="pin" class="inp mono" inputmode="numeric" placeholder="PIN" maxlength="8" style="max-width:180px;text-align:center"><button class="btn" style="max-width:180px" onclick="presGo()">OK</button>`; $("#pin").focus(); }
function presGo() { if (($("#pin").value||"").trim() !== HOST_PIN) { $("#pin").value = ""; $("#pin").placeholder = "Wrong PIN"; return; } IS_HOST = true; startHost(); }
function doJoin() {
  const n = ($("#nm").value||"").trim().slice(0,18);
  if (!ROOM) { const r = ($("#rm")?.value||"").replace(/\D/g,""); if (r.length < 4) return alertBox("Room code?"); ROOM = r; Store.on("", playerRender); }
  if (!n) { $("#nm").focus(); return; }
  Store.set("players/" + PID, {name:n, joined:Store.now()});
}
function alertBox(t){ const i=$("#rm")||$("#nm"); if(i){ i.placeholder=t; i.focus(); } }
let wasLocked = false;
function lockView(t, u) { wasLocked = true; return pShell(`<div class="wait"><div class="big lockic">🔒</div><h2>${t}</h2><div class="sub">${u}</div><div class="badge" style="background:var(--panel);margin-top:10px;font-size:13px">LOCKED · Boshlovchi START bosishini kuting</div></div>`); }
function waitView(icon, t, u) { return pShell(`<div class="wait"><div class="big">${icon}</div><h2>${t}</h2><div class="sub">${u}</div></div>`); }

function investView() {
  if (!DRAFT || DRAFT_R !== RND) { DRAFT = {}; DRAFT_R = RND; FS().forEach(f=>DRAFT[f.id]=0); }
  return pShell(`<h1>${RND===2?"Round 2 · ":""}Invest 100 TIFT$</h1>${RND===2?'<div class="sub gold" style="font-weight:700">New market! Use the 5 checks · 5 ta tekshiruvni qo‘llang</div>':""}<div class="sub">Split your money. You can keep some as cash (0%).<br>Pulni bo‘lib tiking. Bir qismini naqd saqlasangiz ham bo‘ladi.</div>
   ${FS().map(f=>`<div class="card"><div class="pf"><div class="em">${f.em}</div><div><div class="nm">${f.nm}</div><div class="meta">Forecast +${f.sales-f.costs} · Sales ${f.sales} · Costs ${f.costs}</div><div class="risk">⚠ ${f.risk} · ${f.risku}</div></div>
     <div class="stepper"><button onclick="adj('${f.id}',-10)">−</button><span class="v" id="v_${f.id}">${DRAFT[f.id]}</span><button onclick="adj('${f.id}',10)">+</button></div></div></div>`).join("")}
   <div class="sticky"><div class="in"><div style="display:flex;justify-content:space-between;font-weight:700"><span>Invested · Tikildi: <span class="gold mono" id="inv">0</span></span><span class="mu">Cash · Naqd: <span class="mono" id="cash">100</span></span></div>
    <div class="meter"><i id="mt" style="width:0"></i></div><button class="btn" onclick="lockIn()">Confirm · Tasdiqlash ✓</button></div></div>`);
}
function adj(id, d) {
  const used = Object.values(DRAFT).reduce((a,b)=>a+b,0);
  if (d > 0 && used + d > 100) return; DRAFT[id] = Math.max(0, DRAFT[id] + d);
  const u = Object.values(DRAFT).reduce((a,b)=>a+b,0);
  $("#v_"+id).textContent = DRAFT[id]; $("#inv").textContent = u; $("#cash").textContent = 100-u; $("#mt").style.width = u + "%";
  navigator.vibrate && navigator.vibrate(10);
}
function lockIn() {
  if (!cur(R.state).open) return;
  const u = Object.values(DRAFT).reduce((a,b)=>a+b,0);
  Store.update("players/" + PID, {[KA()]:{...DRAFT}, [KC()]:100-u, [KL()]:true});
}
function portfolio(step) {
  const p = me; const FF = FS(), A = p[KA()] || {}; const rows = FF.filter(f=>A[f.id]).map((f)=>{ const i=FF.indexOf(f); const a=A[f.id]; const known=i<step;
    return `<div class="kv"><span>${f.em} ${f.nm} · <span class="mono">${a}</span></span><span class="mono ${known?(f.ret>=0?'grn':'red'):'mu'}">${known?sign(f.ret)+"% → "+fmt(a*(1+f.ret/100)):"?"}</span></div>`; }).join("");
  return `<div class="card">${rows || '<div class="mu">No investments · Tikilmagan</div>'}<div class="kv"><span>💵 Cash · Naqd</span><span class="mono">${p[KC()] ?? 100}</span></div>
   <div class="kv"><b>Total · Jami</b><b class="mono gold">${fmt(money(p, step))} TIFT$</b></div></div>`;
}
function quizView(st) {
  const q = Q[st.q]; const a = at(me.answers, st.q);
  if (a) return pShell(`<div class="wait"><div class="big">🔒</div><h2>Answer locked!</h2><div class="sub">Javobingiz qabul qilindi. Ekranga qarang 👀</div><div class="pbtn c${a.a}" style="min-height:90px;width:70%;margin-top:10px"><span class="sh">${SH[a.a]}</span>${esc(q.o[a.a][0])}</div></div>`);
  return pShell(`<div class="mono mu">QUESTION ${st.q+1}/${Q.length}</div><h2 style="margin-top:6px">${esc(q.q)}</h2><div class="sub">${esc(q.u)}</div>
   <div class="tbar"><i id="tb"></i></div>
   <div class="pbtns">${q.o.map((o,i)=>`<button class="pbtn c${i}" onclick="answer(${i})"><span class="sh">${SH[i]}</span>${esc(o[0])}<small>${esc(o[1])}</small></button>`).join("")}</div>`);
}
function answer(i) {
  const st0 = R.state || {}; const c = cur(st0); const st = {...st0, phase:c.phase, q:c.q}; if (st.phase !== "quiz" || at(me.answers, st.q)) return;
  if (Store.now() - (at(st.qStarts, st.q)||0) > QUIZ_SEC*1000 + 500) return;
  navigator.vibrate && navigator.vibrate(30);
  Store.set(`players/${PID}/answers/${st.q}`, {a:i, t:Store.now()});
}
function qresView(st, ps) {
  const q = Q[st.q]; const a = at(me.answers, st.q); const ok = a && a.a === q.a; const pts = qPoints(me, st.q, st);
  const lb = rankBy(ps, p=>quizTotal(p,st)); const r = lb.findIndex(p=>p.id===PID)+1;
  return pShell(`<div class="verdict rise" style="background:${ok?'rgba(52,211,153,.18)':'rgba(255,107,107,.16)'};border:2px solid ${ok?'var(--grn)':'var(--red)'}">
    <div class="ic">${ok?'🎉':a?'😬':'⏰'}</div><h1>${ok?'Correct! · To‘g‘ri!':a?'Not quite · Xato':'Time is up · Vaqt tugadi'}</h1>
    <div class="mono gold" style="font-size:34px;font-weight:700;margin-top:8px">+${pts}</div></div>
   <div class="card"><div class="kv"><span>Correct answer</span><b>${SH[q.a]} ${esc(q.o[q.a][0])}</b></div><div class="kv"><span>Total points · Ball</span><b class="mono gold">${quizTotal(me,st)}</b></div><div class="kv"><span>Rank · O‘rin</span><b class="mono">${r} / ${ps.length}</b></div></div>`);
}
function playerRender(room) {
  if (IS_HOST) return;
  R = room || {}; const st0 = R.state || {slide:0}; const c = cur(st0); RND = c.r; const st = {...st0, phase:c.phase, q:c.q, step:c.step, open:c.open}; const ps = list(R.players); me = (R.players||{})[PID] || null;
  const sig = !me ? "join" : [st.phase, st.open?1:0, st.phase==="events"?st.step:"", st.q, RND, me[KL()]?1:0, st.q!=null && at(me.answers, st.q)?1:0, st.phase==="lobby"?ps.length:""].join("|");
  if (sig === pSig) return; pSig = sig;
  const nowLocked = (st.phase === "invest" && !st.open) || st.phase === "qwait";
  if (wasLocked && !nowLocked) { wasLocked = false; navigator.vibrate && navigator.vibrate([60,40,120]); setTimeout(()=>{ const t=document.createElement("div"); t.className="unlock"; t.textContent="🔓 GO!"; document.body.appendChild(t); setTimeout(()=>t.remove(), 1100); }, 30); }
  if (!ROOM || !me) { app.innerHTML = joinView(); return; }
  if (st.phase === "lobby") app.innerHTML = waitView("🎉", `You’re in, ${esc(me.name)}!`, `Siz o‘yindasiz! Wait for the host… · ${ps.length} players`);
  else if (st.phase === "invest" && !st.open && !me[KL()]) app.innerHTML = lockView(RND===2 ? "Round 2 is coming" : "Round 1 is coming", "Look at the big screen and read the franchise cards.<br>Katta ekrandagi kartochkalarni o‘qing.");
  else if (st.phase === "qwait") app.innerHTML = lockView(`Question ${st.q+1} / ${Q.length}`, "Get ready! Savolni katta ekrandan o‘qing.");
  else if (st.phase === "invest") app.innerHTML = me[KL()] ? pShell(`<div class="wait" style="padding-bottom:10px"><div class="big">✅</div><h2>Portfolio locked</h2><div class="sub">Tanlovingiz qabul qilindi. Wait for the news…</div></div>${portfolio(0)}`) : investView();
  else if (st.phase === "events") app.innerHTML = pShell(`<div class="wait" style="padding-bottom:10px"><div class="big">📺</div><h2>Watch the screen!</h2><div class="sub">Ekranga qarang — yangiliklar! (${st.step||0}/5)</div></div>${me[KL()]?portfolio(st.step||0):'<div class="card mu">You did not invest · Siz tikmadingiz (100 TIFT$)</div>'}`);
  else if (st.phase === "results") { const rk = rankBy(ps.filter(p=>p[KL()]), p=>money(p)); const r = rk.findIndex(p=>p.id===PID)+1; const m = money(me);
    app.innerHTML = pShell(`<div class="verdict rise" style="background:${m>=100?'rgba(52,211,153,.18)':'rgba(255,107,107,.16)'};border:2px solid ${m>=100?'var(--grn)':'var(--red)'}"><div class="ic">${r===1?'🏆':m>=100?'📈':'📉'}</div><h1 class="mono">${fmt(m)} TIFT$</h1><div class="sub">${m>=100?'Profit · Foyda':'Loss · Zarar'} ${sign(Math.round((m-100)*10)/10)} · Rank ${r||'—'} / ${rk.length}</div></div>${RND===2?`<div class="card"><div class="kv"><span>Round 1</span><b class="mono">${fmt(money(me,5,1))}</b></div><div class="kv"><span>Round 2</span><b class="mono gold">${fmt(money(me,5,2))}</b></div></div>`:""}${me[KL()]?portfolio(5):""}`);
    if (r===1) confetti(200); }
  else if (st.phase === "quiz") app.innerHTML = quizView(st);
  else if (st.phase === "qresult") { app.innerHTML = qresView(st, ps); if (at(me.answers, st.q)?.a === Q[st.q].a) confetti(120); }
  else if (st.phase === "final") { const lb = rankBy(ps, p=>quizTotal(p,st)); const r = lb.findIndex(p=>p.id===PID)+1;
    app.innerHTML = pShell(`<div class="verdict rise" style="background:rgba(255,200,69,.14);border:2px solid var(--gold)"><div class="ic">${r<=3?["🥇","🥈","🥉"][r-1]:"🎓"}</div><h1>Thank you! · Rahmat!</h1></div>
     <div class="card"><div class="kv"><span>Quiz points · Ball</span><b class="mono gold">${quizTotal(me,st)}</b></div><div class="kv"><span>Quiz rank · O‘rin</span><b class="mono">${r} / ${ps.length}</b></div><div class="kv"><span>Investment · Pul (R1 + R2)</span><b class="mono">${fmt(money(me,5,1)+money(me,5,2))} TIFT$</b></div></div>
     <div class="card" style="text-align:center;font-weight:700">Look at the RISK, not only the forecast!<div class="sub">Faqat prognozga emas, xavfga ham qarang!</div></div>`);
    if (r>=1 && r<=3) confetti(250); }
}

/* =========================================================================
   7) TAYMER VA ISHGA TUSHIRISH

setInterval(() => {
  const st0 = R.state || {}; const c = cur(st0); const st = {...st0, phase:c.phase, q:c.q}; if (st.phase !== "quiz") return;
  const t0 = at(st.qStarts, st.q) || Store.now(); const left = Math.max(0, QUIZ_SEC*1000 - (Store.now() - t0)); const fr = left/(QUIZ_SEC*1000);
  if (IS_HOST) { const rg=$("#rg"), rn=$("#rn"); if (rg) { rg.style.strokeDashoffset = 276.5*(1-fr); rg.style.stroke = fr>.3 ? "#FFC845" : "#FF6B6B"; } if (rn) rn.textContent = Math.ceil(left/1000);
    if (left <= 0) hostReveal(); }
  else { const tb = $("#tb"); if (tb) { tb.style.width = (fr*100)+"%"; tb.style.background = fr>.3 ? "#FFC845" : "#FF6B6B"; }
    if (left <= 0 && tb) document.querySelectorAll(".pbtn").forEach(b=>b.disabled=true); }
}, 150);

function startHost() {
  ensureHostRoom(); bgMarket();
  document.documentElement.classList.add("host");
  addEventListener("keydown", e => { if (["ArrowRight","PageDown"," ","Enter"].includes(e.key) && e.target.tagName !== "INPUT") { e.preventDefault(); hostNext(); } });
  let init = false;
  Store.on("", room => { if (!IS_HOST) return; if (!init) { init = true; if (!room || !room.state || room.state.slide == null) { Store.set("state", {slide:0}); return; } } hostRender(room); });
}
if (IS_HOST) startHost();
else if (!ROOM) {
  app.innerHTML = joinView();
} else {
  Store.on("", playerRender);
}
