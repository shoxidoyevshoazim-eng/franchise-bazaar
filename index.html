<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Franchise Bazaar Live</title>
<!--
  FRANCHISE BAZAAR LIVE — TIFT · Business English · Unit 8
  ---------------------------------------------------------
  Proyektor (boshlovchi):  index.html?host=1
  Talabalar (telefon):     QR kod orqali avtomatik ochiladi (index.html?room=XXXX)

  Firebase sozlanmagan bo'lsa -> DEMO rejim: faqat bitta brauzerdagi oynalar o'zaro ishlaydi (mashq uchun).
  Firebase ma'lumotlarini pastdagi CONFIG ichiga qo'ying -> LIVE rejim: hamma telefonlar ishlaydi.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Anton&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>

*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:var(--f-body),system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--tx);
background:radial-gradient(ellipse at 15% -10%,var(--glow) 0%,var(--bg1) 45%,var(--bg2) 100%) fixed;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
.mono{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace}
.gold{color:var(--gold)}.teal{color:var(--teal)}.mu{color:var(--mu)}.red{color:var(--red)}.grn{color:var(--grn)}
button{font:inherit;color:inherit;border:0;cursor:pointer}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes flip{0%{transform:rotateY(90deg);opacity:.2}100%{transform:none;opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
#hb{position:fixed;inset:0;z-index:70;background:#030406;color:var(--tx);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;padding:24px}
#hb .ok{font-size:22px;font-weight:800;letter-spacing:.02em}
#hb .ok b{color:#ff3b4e}
#hb svg{width:100%;max-width:560px;height:190px;margin:34px 0 0;overflow:visible}
#hb .ln{fill:none;stroke:#ff2d45;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:140 860;animation:ecg 2.2s linear infinite;filter:drop-shadow(0 0 6px #ff2d45) drop-shadow(0 0 14px rgba(255,45,69,.7))}
#hb.ramp .ln{animation-duration:.55s!important;stroke-width:4.5}
#hb.ramp{animation:hbred 1.4s ease-in forwards}
#hb.flat{animation:none;background:#030406;transition:background .3s}
@keyframes hbred{to{background:#5a0d18}}
.gate{position:fixed;inset:0;z-index:30;background:#030406;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2vh}
.gate .gq{background:#fff;padding:2.2vh;border-radius:2.4vh;box-shadow:0 0 80px rgba(255,45,69,.25)}
.gate .gq img,.gate .gq canvas{display:block;width:62vh!important;height:62vh!important;image-rendering:pixelated}
.gate .gs{font:800 3.4vh/1.2 var(--f-ui,sans-serif);color:var(--tx);letter-spacing:.02em}
.gate .gs span{color:var(--gold)}
.gate .gc{position:fixed;right:2.4vh;bottom:2vh;font:600 1.8vh/1 monospace;color:#4a5170;letter-spacing:.1em}
.gate .gc b{color:#8a93ad}
html.ongate .H{transform:none!important;animation:none!important;filter:none!important}
html.ongate .H-top,html.ongate #bg,html.ongate #ph{visibility:hidden}
html.ongate .H-bot{position:fixed;left:0;right:0;bottom:0;padding:1rem 2rem;z-index:31;opacity:.15;transition:opacity .3s}
html.ongate .H-bot:hover,html.ongate .H-bot:focus-within{opacity:1}
html.ongate .H-bot>div:first-child{visibility:hidden}   /* QR slaydda chapdagi yozuv xona raqami bilan ustma-ust tushmasin */
html.ongate .gate .gc{right:auto;left:2.4vh}
html.ongate #qr img,html.ongate #qr canvas{width:min(62vh,80vw)!important;height:auto!important;display:block}
#bqr{background:#fff;padding:2.2vh;border-radius:2.4vh;line-height:0}
#bqr img,#bqr canvas{width:min(58vh,80vw)!important;height:auto!important;display:block}
html.ongate #qr{padding:2.2vh;border-radius:2.4vh;border:0}
#hb .bg{fill:none;stroke:rgba(255,45,69,.12);stroke-width:2}
#hb .wt{font-size:16px;color:#8a93ad;animation:pulse 2.2s ease-in-out infinite;margin-top:14vh}
#hb .ko{position:absolute;bottom:26px;left:16px;right:16px;font-size:14px;color:var(--mu)}
#hb .ko b{color:var(--gold)}
@keyframes ecg{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){#hb .ln{animation-duration:6s}}
#sy{position:fixed;inset:0;z-index:80;background:#04050a;color:var(--tx);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;transition:opacity .7s ease;overflow:hidden}
#sy .gl{position:absolute;inset:-20%;background:radial-gradient(circle at 50% 50%,rgba(255,140,40,.75),rgba(255,140,40,0) 55%);opacity:0;pointer-events:none}
#sy .fl{position:absolute;inset:0;opacity:0;pointer-events:none}
#sy .lu{position:relative;font-size:42px;font-weight:800;letter-spacing:.04em;animation:pulse 3s ease-in-out infinite}
#sy .lu small{display:block;font-size:19px;font-weight:600;letter-spacing:0;color:var(--mu);margin-top:6px}
#sy .bt{position:absolute;left:0;right:0;top:27%;font-size:34px;font-weight:800;letter-spacing:.03em;opacity:0;padding:0 12px}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(var(--gold-rgb),.0)}50%{box-shadow:0 0 40px 6px rgba(var(--gold-rgb),.45)}}
.pop{animation:pop .5s cubic-bezier(.2,.9,.3,1.3) both}.rise{animation:rise .6s ease both}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.badge{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:.8em;padding:.2em .6em;border-radius:6px;letter-spacing:.05em}

/* ---------------- HOST (projector) ---------------- */
html.host{font-size:min(calc(var(--vw,100vw)/100),calc(var(--vh,100vh)*.0172))}
.H{height:var(--vh,100vh);display:flex;flex-direction:column;padding:2.2rem 3.2rem 1.6rem}
.H-top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:.9rem;font-size:1.25rem}
.H-main{flex:1;min-height:0;display:flex;flex-direction:column;padding-top:1.6rem}
.H-bot{display:flex;justify-content:space-between;align-items:center;padding-top:1rem;font-size:1.1rem}
.nextbtn{background:var(--gold);color:var(--ink);font-weight:800;font-size:1.5rem;padding:.8rem 2rem;border-radius:12px;box-shadow:0 6px 0 var(--goldsh)}
.nextbtn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--goldsh)}
.ghost{background:transparent;border:1px solid var(--line);color:var(--mu);padding:.5rem 1rem;border-radius:8px;font-size:1rem;margin-left:.6rem}
.kick{font-family:'JetBrains Mono',monospace;color:var(--gold);letter-spacing:.25em;font-size:1.3rem;text-transform:uppercase}
.h1{font-size:5.6rem;font-weight:800;line-height:1.02;letter-spacing:-.03em}
.h2{font-size:3.4rem;font-weight:800;line-height:1.05;letter-spacing:-.02em}
.uz{color:var(--mu);font-size:1.6rem;margin-top:.4rem}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px}
.livepill{font-size:1.4rem;vertical-align:middle;background:var(--red);color:#fff;padding:.2rem .8rem;border-radius:8px;animation:pulse 1.6s infinite;letter-spacing:.1em}
/* lobby */
.lobby{display:grid;grid-template-columns:1.15fr 1fr;gap:3rem;flex:1;min-height:0}
.joinbox{display:flex;gap:2.2rem;align-items:center;margin-top:1.5rem;padding:1.4rem;background:var(--panel);border:1px solid var(--line);border-radius:18px}
#qr{background:#fff;padding:14px;border-radius:12px;line-height:0}
.code{font-size:6rem;font-weight:700;color:var(--gold);letter-spacing:.1em;line-height:1}
.url{font-size:1.3rem;color:var(--mu);word-break:break-all;margin-top:.6rem}
.count{font-size:2.2rem;font-weight:800}.count b{color:var(--gold);font-size:3.2rem}
.chips{display:flex;flex-wrap:wrap;gap:.8rem;margin-top:1.4rem;align-content:flex-start;overflow:hidden}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:.6rem 1.3rem;font-size:1.6rem;font-weight:700}
/* franchise cards host */
.frow{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:1.2rem;flex:1;min-height:0;margin-top:1.6rem}
.fcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:1.1rem 1.1rem;display:flex;flex-direction:column;gap:.35rem;position:relative;overflow:hidden}
.fcard .em{font-size:3rem;line-height:1}
.fcard .nm{font-size:1.8rem;font-weight:800}
.fcard .ty{font-size:1.15rem;color:var(--mu)}
.fcard .rowv{display:flex;justify-content:space-between;font-size:1.3rem}
.fcard .big{font-size:2.8rem;font-weight:800;font-family:'JetBrains Mono',monospace;line-height:1}
.fcard .risk{font-size:1.15rem;color:var(--risk);margin-top:auto}
.qres .opt{font-size:1.5rem;min-height:auto;padding:.9rem 1.3rem}
@media (max-height:820px){html.host .fcard .ty{display:none}}   /* kichik ekranda 6 ta kartochka sig'ishi uchun */
.qres .opt small{font-size:1.45rem}
.crowd{margin-top:.6rem}
.crowd .bar{height:14px;background:rgba(var(--wash),.08);border-radius:7px;overflow:hidden}
.crowd .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--gold));width:0;transition:width .8s ease}
.crowd .lbl{font-size:1.1rem;color:var(--mu);margin-top:.35rem;font-family:'JetBrains Mono',monospace}
.mystery{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;font-size:6rem;color:var(--line)}
.ev{animation:flip .7s ease both}
.ev .head{font-size:1.5rem;font-weight:800;line-height:1.2}
.ev .ret{font-size:3.6rem;font-weight:800;font-family:'JetBrains Mono',monospace}
.tag{font-family:'JetBrains Mono',monospace;font-size:1.05rem;font-weight:700;padding:.3rem .7rem;border-radius:6px;color:var(--ink);align-self:flex-start}
/* results */
.res{display:grid;grid-template-columns:1fr 1.25fr;gap:2.4rem;flex:1;min-height:0;margin-top:1.2rem}
.hbar{display:grid;grid-template-columns:12rem 1fr 6rem;align-items:center;gap:1rem;margin:.9rem 0;font-size:1.5rem}
.hbar .track{height:2.2rem;position:relative;background:rgba(var(--wash),.05);border-radius:6px}
.hbar .track i{position:absolute;top:0;bottom:0;border-radius:6px;transition:all 1.2s cubic-bezier(.2,.8,.2,1)}
.hbar .track .zero{position:absolute;top:-.3rem;bottom:-.3rem;width:2px;background:var(--mu)}
.lb{display:flex;flex-direction:column;gap:.55rem}
.lbrow{display:grid;grid-template-columns:3.4rem 1fr 8rem;align-items:center;gap:1rem;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:.55rem 1.1rem;font-size:1.6rem}
.lbrow .rk{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--mu)}
.lbrow .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbrow .val{font-family:'JetBrains Mono',monospace;font-weight:700;text-align:right}
.lbrow.top{border-color:var(--gold);animation:glow 2s infinite}
/* quiz host */
.qhead{display:flex;justify-content:space-between;align-items:flex-start;gap:2rem}
.qtext{font-size:3.6rem;font-weight:800;line-height:1.1}
.ring{position:relative;width:11rem;height:11rem;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:4rem;font-weight:700}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem;margin-top:auto}
.opt{border-radius:14px;padding:1.4rem 1.8rem;display:flex;align-items:center;gap:1.4rem;font-size:1.8rem;font-weight:800;position:relative;overflow:hidden;min-height:8.5rem;color:#fff}
.opt .sh{font-size:2.6rem;width:3rem;text-align:center;flex:none}
.opt small{display:block;font-size:1.9rem;font-weight:700;opacity:1;margin-top:.2rem}
.opt .cnt{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:2.6rem}
.opt .fill{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.18);width:0;transition:width 1s ease}
.opt.dim{opacity:.32}.opt.ok{outline:5px solid #fff;animation:glow 1.6s infinite}
.rotd{display:block}.rotd.rotin{animation:rotin .35s ease-out}@keyframes rotin{from{opacity:0;transform:translateY(.7em)}to{opacity:1;transform:none}}
.vwin{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4rem;min-height:0}
.opt.vbig{width:min(74rem,92%);min-height:13rem;font-size:2.4rem;padding:2rem 3rem;outline:6px solid #fff;box-shadow:0 0 60px rgba(var(--gold-rgb),.35)}.opt.vbig small{font-size:4rem;line-height:1.1}.opt.vbig .sh{font-size:4.2rem;width:5rem}
.vcnt{font-size:2.8rem;font-weight:800;color:var(--gold);font-family:'JetBrains Mono',monospace}
.c0{background:var(--a0)}.c1{background:var(--a1)}.c2{background:var(--a2)}.c3{background:var(--a3)}
.answered{font-size:1.6rem;color:var(--mu);margin-top:.8rem}
.qres{display:grid;grid-template-columns:1.6fr 1fr;gap:2rem;flex:1;min-height:0;margin-top:1.4rem}
.expl{margin-top:1.2rem;font-size:1.7rem;background:var(--panel);border-left:6px solid var(--grn);padding:1rem 1.4rem;border-radius:10px}
/* final */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:1.6rem;flex:1;margin-top:1rem}
.pcol{display:flex;flex-direction:column;align-items:center;gap:.6rem;width:19rem}
.pname{font-size:2.1rem;font-weight:800;text-align:center;max-width:19rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ppts{font-family:'JetBrains Mono',monospace;color:var(--mu);font-size:1.5rem}
.pblock{width:100%;border-radius:14px 14px 0 0;display:flex;justify-content:center;padding-top:1rem;font-size:4.4rem;font-weight:800;font-family:'JetBrains Mono',monospace;color:var(--ink);animation:rise 1s ease both}

/* ---------------- PLAYER (phone) ---------------- */
.P{max-width:560px;margin:0 auto;padding:18px 16px 120px;min-height:100vh}
.P-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mu);padding:4px 0 14px}
.P h1{font-size:30px;font-weight:800;line-height:1.1;letter-spacing:-.02em}
.P h2{font-size:23px;font-weight:800;line-height:1.15}
.P .sub{color:var(--mu);font-size:15px;margin-top:6px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}
.inp{width:100%;font:inherit;font-size:20px;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--inp);color:var(--tx);outline:none;margin-top:10px}
.inp:focus{border-color:var(--gold)}
.btn{width:100%;background:var(--gold);color:var(--ink);font-weight:800;font-size:19px;padding:15px;border-radius:14px;margin-top:14px;box-shadow:0 5px 0 var(--goldsh)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--goldsh)}
.btn:disabled{opacity:.4}
.wait{display:flex;flex-direction:column;align-items:center;text-align:center;padding:50px 10px;gap:14px}
.wait .big{font-size:64px;animation:pulse 1.8s infinite}
.pf{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center}
.pf .em{font-size:34px}
.pf .nm{font-weight:800;font-size:18px}
.pf .meta{font-size:13px;color:var(--mu)}
.pf .risk{font-size:12.5px;color:var(--risk)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:40px;height:40px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:22px;font-weight:800}
.stepper .v{min-width:44px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;color:var(--gold)}
.sticky{position:fixed;left:0;right:0;bottom:0;background:rgba(var(--bg2-rgb),.96);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));backdrop-filter:blur(8px)}
.sticky .in{max-width:560px;margin:0 auto}
.meter{height:10px;border-radius:5px;background:rgba(var(--wash),.08);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--gold));transition:width .3s}
.pbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.pbtn{border-radius:16px;min-height:150px;padding:14px;color:#fff;font-weight:800;font-size:18px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:6px;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.pbtn .sh{font-size:30px}.pbtn small{font-size:17px;font-weight:700;opacity:1}
.pbtn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.ptop{position:sticky;top:0;z-index:6;margin:0 -16px 10px;padding:4px 16px 8px;background:var(--bg2,#0b0a09);box-shadow:0 6px 14px rgba(0,0,0,.35)}
.ptimer{display:flex;align-items:center;justify-content:space-between;margin-top:8px;font-size:14px;font-weight:700;color:var(--mu)}
.ptimer b{font:800 34px/1 var(--f-mono,monospace);color:var(--gold);min-width:2ch;text-align:right}
.ptimer b.low{color:var(--red);animation:pulse .8s infinite}
.tbar{height:8px;border-radius:4px;background:rgba(var(--wash),.1);overflow:hidden;margin-top:12px}
.tbar i{display:block;height:100%;background:var(--gold);width:100%}
.verdict{text-align:center;padding:36px 12px;border-radius:20px;margin-top:16px}
.verdict .ic{font-size:70px}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:16px}
.kv:last-child{border-bottom:0}
.demo{background:#7C3AED;color:#fff;font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px}

#bg{position:fixed;inset:0;z-index:-1;pointer-events:none}
.slide-in{animation:slidein .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes slidein{from{opacity:0;transform:scale(.985) translateY(10px)}to{opacity:1;transform:none}}
.grad{background:linear-gradient(90deg,var(--gold),var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent}
.gold2{color:var(--gold2)}
.miniqr{display:inline-flex;gap:.8rem;align-items:center;font-size:1.3rem}
.miniqr #mqr{background:#fff;padding:4px;border-radius:5px;line-height:0}
.miniqr b{font-size:1.6rem}
.opt-row{display:flex;gap:1.6rem;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:1.2rem 1.8rem;margin-top:1.2rem;font-size:2.2rem;font-weight:800}
.opt-row b{font-size:3rem}.opt-row small{display:block;font-size:1.4rem;color:var(--mu);font-weight:600}
.hid{opacity:0;transform:translateY(20px) scale(.97);transition:all .6s cubic-bezier(.2,.8,.2,1)}
.hid.show{opacity:1;transform:none}
.src{font-size:1.15rem;margin-top:auto}
.timeline{display:grid;grid-template-columns:repeat(3,1fr);gap:2rem;margin:2.6rem 0 2rem;position:relative}
.timeline:before{content:"";position:absolute;left:0;right:0;top:3.6rem;height:3px;background:var(--line)}
.tl{text-align:center;display:flex;flex-direction:column;align-items:center;gap:.6rem}
.timeline.tl5{grid-template-columns:repeat(5,1fr);gap:1.2rem;margin:1.2rem 0 .9rem}
.timeline.tl5 .tl{gap:.4rem}
.timeline:after{content:"";position:absolute;left:0;top:3.6rem;height:3px;width:var(--tp,0%);background:linear-gradient(90deg,var(--gold),var(--teal));box-shadow:0 0 12px var(--gold);transition:width .9s cubic-bezier(.3,.8,.3,1)}
.timeline.tl5:before,.timeline.tl5:after{top:3.95rem}
.tl.show .dot:after{content:"";position:absolute;inset:-.5rem;border-radius:50%;border:2px solid var(--gold);animation:ring 2.4s ease-out infinite}
@keyframes ring{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.2);opacity:0}}
#repm{position:fixed;inset:0;z-index:96;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center}
#repm .rp-card{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:2.2rem 2.6rem;text-align:center;min-width:34rem}

    const diag = m => { if (got) return; const d = document.createElement("div"); d.style.cssText = "position:fixed;left:50%;top:40%;transform:translateX(-50%);z-index:9999;background:var(--panel2);color:#fff;padding:24px 28px;border-radius:16px;font:600 20px/1.5 sans-serif;max-width:90vw;text-align:center;border:2px solid var(--red)"; d.innerHTML = m; document.body.appendChild(d); };
    setTimeout(() => diag("⚠️ Firebase bilan aloqa yo‘q (8 soniya).<br>Internetni tekshiring yoki sahifani yangilang (F5)."), 8000);
    return { on:(p,cb)=>r(p).on("value", s=>{ got = true; cb(s.val()); }, err => diag("⚠️ Firebase xatosi: " + esc(err && (err.code || err.message)))), set:(p,v)=>r(p).set(v).catch(e=>diag("⚠️ Yozib bo‘lmadi: "+esc(e.code||e.message))), update:(p,v)=>r(p).update(v).catch(e=>diag("⚠️ Yozib bo‘lmadi: "+esc(e.code||e.message))), now:()=>Date.now()+off };
  }
  const key = () => "fbz_room_" + ROOM; const subs = [];
  let bc = null; try { bc = ("BroadcastChannel" in window) ? new BroadcastChannel("fbz") : null; } catch(e) {}
  let mem = null;
  const load = () => { try { const v = localStorage.getItem(key()); if (v != null) return JSON.parse(v); } catch(e) {} return mem ? JSON.parse(JSON.stringify(mem)) : {}; };
  const get = (o,p) => p ? p.split("/").reduce((a,k)=> a==null ? null : a[k], o) : o;
  const put = (o,p,v) => { const ks=p.split("/"); let a=o; ks.slice(0,-1).forEach(k=>{ if(typeof a[k]!=="object"||a[k]===null) a[k]={}; a=a[k]; }); const last=ks[ks.length-1]; if(v===null) delete a[last]; else a[last]=v; };
  const fire = () => { const o = load(); subs.forEach(s => s.cb(get(o,s.p) ?? null)); };
  const save = o => { mem = o; try { localStorage.setItem(key(), JSON.stringify(o)); } catch(e) {} try { bc && bc.postMessage(ROOM); } catch(e) {} fire(); };
  if (bc) bc.onmessage = e => { if (e.data === ROOM) fire(); };
  addEventListener("storage", e => { if (e.key === key()) fire(); });
  return {
    on:(p,cb)=>{ subs.push({p,cb}); setTimeout(()=>cb(get(load(),p) ?? null)); },
    set:(p,v)=>{ const o=load(); if(!p){ save(v||{}); return; } put(o,p,v); save(o); },
    update:(p,v)=>{ const o=load(); Object.entries(v).forEach(([k,x])=>put(o,(p?p+"/":"")+k,x)); save(o); },
    now:()=>Date.now()
  };
})();

function money(p, step = 99, r = RND) {

  if (!p || !p[L]) return 100;

function ansOf(qi) { const q = Q[qi]; if (!q || q.vote) return null; const s = (R.state||{}).ans; const v = s ? at(s, qi) : null; if (v && v.a != null) return v.a; return IS_HOST ? HA[qi] : undefined; }

function startAnim(kind) {
  stopAnim(); const cv = $("#sc"); if (!cv) return; const x = cv.getContext("2d"); let t = 0, W, H;
  const fit = () => { W = cv.width = cv.clientWidth*devicePixelRatio; H = cv.height = cv.clientHeight*devicePixelRatio; }; fit();
  const dpr = devicePixelRatio;
  let P = [], n = 0;
  const N = {Miami:[-80.2,25.8],London:[-0.1,51.5],Istanbul:[29,41],Dubai:[55.3,25.2],Almaty:[76.9,43.2],Tashkent:[69.2,41.3]};
  const RT = [["Miami","Tashkent"],["Miami","London"],["London","Istanbul"],["Istanbul","Tashkent"],["Dubai","Tashkent"],["Almaty","Tashkent"],["London","Dubai"]];
  const pos = c => [W*.07+(N[c][0]+95)/180*W*.86, H*.16+(62-N[c][1])/47*H*.66];
  function frame() {
    t += .008; x.clearRect(0,0,W,H);
    if (kind === "routes") {
      x.strokeStyle=("rgba("+TH("mu-rgb")+",.12)"); x.lineWidth=dpr;
      for (let lo=-90; lo<=90; lo+=15) { const px=W*.07+(lo+95)/180*W*.86; x.beginPath(); x.moveTo(px,H*.06); x.lineTo(px,H*.94); x.stroke(); }

      RT.forEach((r,i)=>{ const a=pos(r[0]), b=pos(r[1]), mx=(a[0]+b[0])/2, my=Math.min(a[1],b[1])-Math.abs(a[0]-b[0])*.25, hq=r[1]==="Tashkent";
        x.strokeStyle=hq?("rgba("+TH("gold-rgb")+",.5)"):("rgba("+TH("teal-rgb")+",.35)"); x.lineWidth=2*dpr; x.beginPath(); x.moveTo(a[0],a[1]); x.quadraticCurveTo(mx,my,b[0],b[1]); x.stroke();
        for (let k=0;k<3;k++){ const u=(t*.6+i*.13+k/3)%1, px=(1-u)*(1-u)*a[0]+2*(1-u)*u*mx+u*u*b[0], py=(1-u)*(1-u)*a[1]+2*(1-u)*u*my+u*u*b[1];
          x.fillStyle=hq?TH("gold"):TH("teal"); x.shadowBlur=14; x.shadowColor=x.fillStyle; x.beginPath(); x.arc(px,py,4*dpr,0,7); x.fill(); x.shadowBlur=0; } });
      Object.keys(N).forEach(c=>{ const p=pos(c), hq=c==="Tashkent", pl=1+.45*Math.sin(t*6);
        x.strokeStyle=hq?("rgba("+TH("gold-rgb")+",.8)"):("rgba("+TH("tx-rgb")+",.35)"); x.lineWidth=1.5*dpr; x.beginPath(); x.arc(p[0],p[1],(hq?16:10)*pl*dpr,0,7); x.stroke();
        x.fillStyle=hq?TH("gold"):TH("tx"); x.beginPath(); x.arc(p[0],p[1],(hq?8:5)*dpr,0,7); x.fill();
        x.font=(hq?"700 ":"600 ")+Math.round((hq?24:20)*dpr)+"px JetBrains Mono,monospace"; x.textAlign="center"; x.fillStyle=hq?TH("gold"):TH("mu"); x.fillText(c.toUpperCase(), p[0], p[1]+(c==="Almaty"?-22:38)*dpr); });
    } else if (kind === "flow") {
      n++; const y1=H*.33, y2=H*.67; x.lineWidth=dpr;
      x.strokeStyle=("rgba("+TH("teal-rgb")+",.4)"); x.beginPath(); x.moveTo(0,y1); x.lineTo(W,y1); x.stroke();
      x.strokeStyle=("rgba("+TH("gold-rgb")+",.4)"); x.beginPath(); x.moveTo(0,y2); x.lineTo(W,y2); x.stroke();
      if (n%20===0) { P.push({l:0,x:0}); P.push({l:1,x:W}); }
      P.forEach(p=>{ if(p.l===0){ p.x+=3*dpr; x.fillStyle=TH("teal"); x.shadowBlur=12; x.shadowColor=TH("teal"); x.fillRect(p.x-8*dpr,y1-8*dpr,16*dpr,16*dpr); } else { p.x-=3*dpr; x.fillStyle=TH("gold"); x.shadowBlur=12; x.shadowColor=TH("gold"); x.beginPath(); x.arc(p.x,y2,9*dpr,0,7); x.fill(); } });
      x.shadowBlur=0; P = P.filter(p=>p.x>-30 && p.x<W+30);

let beepBuf = null, beepLoading = null, flatBuf = null;
function loadBeep(a){ if (beepBuf || beepLoading || !a) return; fetch(FLAT).then(r=>r.arrayBuffer()).then(b=>new Promise((ok,no)=>a.decodeAudioData(b,ok,no))).then(buf=>{ flatBuf = buf; }).catch(()=>{}); beepLoading = fetch(BEEP).then(r=>r.arrayBuffer()).then(b=>new Promise((ok,no)=>a.decodeAudioData(b,ok,no))).then(buf=>{ beepBuf = buf; }).catch(()=>{ beepLoading = null; }); }
// yurak "to'xtashi": cho'ziq "piiiip" sekin so'nadi
function flatline(a, dest, t, g){ if (flatBuf) { const src=a.createBufferSource(); src.buffer=flatBuf; const v=a.createGain(); v.gain.value=g; src.connect(v); v.connect(dest); src.start(t); return; }
  const o=a.createOscillator(), v=a.createGain(); o.type="square"; o.frequency.value=1025; v.gain.setValueAtTime(0,t); v.gain.linearRampToValueAtTime(g*.2,t+.01); v.gain.setValueAtTime(g*.2,t+.8); v.gain.linearRampToValueAtTime(0,t+3.4); o.connect(v); v.connect(dest); o.start(t); o.stop(t+3.5); }
function beep(a, dest, t, g, dur){ dur = dur || 0;
  if (!beepBuf) { const o=a.createOscillator(), v=a.createGain(), d=dur||.25; o.type="square"; o.frequency.value=1025; v.gain.setValueAtTime(0,t); v.gain.linearRampToValueAtTime(g*.22,t+.006); v.gain.setValueAtTime(g*.22,t+d-.05); v.gain.linearRampToValueAtTime(0,t+d); o.connect(v); v.connect(dest); o.start(t); o.stop(t+d+.02); return; }
  const src=a.createBufferSource(); src.buffer=beepBuf; const v=a.createGain(); v.gain.setValueAtTime(g,t); if (dur) { v.gain.setValueAtTime(g,t+dur-.03); v.gain.linearRampToValueAtTime(0,t+dur); } src.connect(v); v.connect(dest); src.start(t); if (dur) src.stop(t+dur+.02); }

let HB=null; const HBP=[174,1051];
function thump(t,g){ const a=AC; const o=a.createOscillator(), v=a.createGain(); o.frequency.setValueAtTime(70,t); o.frequency.exponentialRampToValueAtTime(42,t+.2); v.gain.setValueAtTime(0,t); v.gain.linearRampToValueAtTime(g,t+.012); v.gain.exponentialRampToValueAtTime(.0001,t+.25); o.connect(v); v.connect(MASTER); o.start(t); o.stop(t+.3); }
function startHeart(){ if(HB||!AC) return; loadBeep(AC); let done={}; HB=setInterval(()=>{ if(!AC) return; const now=Store.now(), base=now-now%2200;
  [base-2200,base,base+2200].forEach(c=>HBP.forEach(o=>{ const at=c+o, dt=(at-now)/1000; if(dt>=0&&dt<.35&&!done[at]){ done[at]=1; const t=AC.currentTime+dt; beep(AC,MASTER,t,.6); } })); },60); }
function stopHeart(){ if(HB){ clearInterval(HB); HB=null; } }
function heartRamp(){ if(!AC) return; let t=AC.currentTime+.05, gap=.6; while(gap>.12){ beep(AC,MASTER,t,.6,Math.min(.2,gap*.55)); t+=gap; gap*=.72; } flatline(AC,MASTER,t,.55); }

  else if (st.phase === "events") app.innerHTML = pShell(`<div class="wait" style="padding-bottom:10px"><div class="big">📺</div><h2>Watch the screen!</h2><div class="sub">Ekranga qarang — yangiliklar! (${st.step||0}/${FS().length})</div></div>${me[KL()]?portfolio(st.step||0):'<div class="card mu">You did not invest · Siz tikmadingiz (100 TIFT$)</div>'}`);
  else if (st.phase === "results") { const rk = rankBy(ps.filter(p=>p[KL()]), p=>money(p)); const r = rk.findIndex(p=>p.id===PID)+1; const m = money(me);
    app.innerHTML = pShell(`<div class="verdict rise" style="background:${m>=100?'rgba(var(--grn-rgb),.18)':'rgba(var(--red-rgb),.16)'};border:2px solid ${m>=100?'var(--grn)':'var(--red)'}"><div class="ic">${r===1?'🏆':m>=100?'📈':'📉'}</div><h1 class="mono">${fmt(m)} TIFT$</h1><div class="sub">${m>=100?'Profit · Foyda':'Loss · Zarar'} ${sign(Math.round((m-100)*10)/10)} · Rank · O‘rin ${r||'—'} / ${rk.length}</div></div>${RND===2?`<div class="card"><div class="kv"><span>Round 1</span><b class="mono">${fmt(money(me,99,1))}</b></div><div class="kv"><span>Round 2</span><b class="mono gold">${fmt(money(me,99,2))}</b></div></div>`:""}${me[KL()]?portfolio(99):""}`);
    if (r===1) confetti(200); }
  else if (st.phase === "quiz") app.innerHTML = quizView(st);
  else if (st.phase === "qresult") { app.innerHTML = qresView(st, ps); if (okA(st.q, at(me.answers, st.q)?.a)) confetti(120); }
  else if (st.phase === "final") { const lb = rankBy(ps, p=>quizTotal(p,st)); const r = lb.findIndex(p=>p.id===PID)+1;
    app.innerHTML = pShell(`<div class="verdict rise" style="background:rgba(var(--gold-rgb),.14);border:2px solid var(--gold)"><div class="ic">${r<=3?["🥇","🥈","🥉"][r-1]:"🎓"}</div><h1>Thank you! · Rahmat!</h1></div>
     <div class="card"><div class="kv"><span>Quiz points · Ball</span><b class="mono gold">${quizTotal(me,st)}</b></div><div class="kv"><span>Quiz rank · O‘rin</span><b class="mono">${r} / ${ps.length}</b></div><div class="kv"><span>Investment · Pul${me.locked2?" (R1 + R2)":""}</span><b class="mono">${fmt(money(me,99,1)+(me.locked2?money(me,99,2):0))} TIFT$</b></div></div>
     <div class="card" style="text-align:center;font-weight:700">Look at the RISK, not only the forecast!<div class="sub">Faqat prognozga emas, xavfga ham qarang!</div></div>`);
    if (r>=1 && r<=3) confetti(250); }
}

/* =========================================================================
   7) TAYMER VA ISHGA TUSHIRISH
   ========================================================================= */
let invDone = "";
setInterval(() => {
  const st0 = R.state || {}; const c = cur(st0); const st = {...st0, phase:c.phase, q:c.q};
  if (st.phase === "invest" && c.open && st0.iT0) {   // 60 soniyalik pul tikish taymeri
    const left = Math.max(0, INV_SEC*1000 - (Store.now() - st0.iT0)), fr = left/(INV_SEC*1000), sec = Math.ceil(left/1000), key = c.i + ":" + st0.iT0;
    if (IS_HOST) { const p = $("#itp"), n = $("#itn"); if (p) { p.style.display = ""; const txt = sec ? String(sec) : "⏰"; if (n.textContent !== txt) { if (sec <= 10 && sec > 0) SFX.tick(); n.textContent = txt; n.style.color = fr > .17 ? "" : "var(--red)"; }
        if (!left && invDone !== key) { invDone = key; stopLoop(); SFX.buzz(); } } }
    else { const tb = $("#itb"); if (tb) { tb.style.width = (fr*100) + "%"; tb.style.background = fr > .17 ? "var(--gold)" : "var(--red)"; }
      const tn = $("#itnp"); if (tn) { tn.textContent = sec ? sec : "⏰"; tn.classList.toggle("low", fr <= .17); }
      if (!left && invDone !== key && me && !me[KL()] && DRAFT) { invDone = key; lockIn(); } }   // vaqt tugadi: tanlov avtomatik saqlanadi
    return; }
  if (st.phase !== "quiz") return;
  const t0 = at(st.qStarts, st.q) || Store.now(); const QS_ = qSec(st.q); const left = Math.max(0, QS_*1000 - (Store.now() - t0)); const fr = left/(QS_*1000);
  const rq = Q[st.q] && Q[st.q].rot; if (rq) { const k = Math.floor(Math.max(0, Store.now() - t0) / 2000) % rq.length;   // 4-variant har 2 soniyada almashadi (hamma ekranda bir vaqtda)
    document.querySelectorAll(".rotd").forEach(el => { if (+el.dataset.i === k) return; el.dataset.i = k; el.innerHTML = esc(rq[k][0]) + "<small>" + esc(rq[k][1]) + "</small>"; el.classList.remove("rotin"); void el.offsetWidth; el.classList.add("rotin"); }); }
  if (IS_HOST) { const rg=$("#rg"), rn=$("#rn"); if (rg) { rg.style.strokeDashoffset = 276.5*(1-fr); rg.style.stroke = fr>.3 ? "var(--gold)" : "var(--red)"; } if (rn) { const sec=Math.ceil(left/1000); if (rn.textContent !== String(sec) && sec<=5 && sec>0 && c.phase==="quiz") SFX.tick(); rn.textContent = sec; }
    if (left <= 0) hostReveal(); }
  else { const tb = $("#tb"); if (tb) { tb.style.width = (fr*100)+"%"; tb.style.background = fr>.3 ? "var(--gold)" : "var(--red)"; }
    const tn = $("#tnp"); if (tn) { const sc = Math.ceil(left/1000); tn.textContent = sc ? sc : "⏰"; tn.classList.toggle("low", fr <= .3); }
    if (left <= 0 && tb) document.querySelectorAll(".pbtn").forEach(b=>b.disabled=true); }
}, 150);

/* ---- kirish videosini QR paytidayoq to'liq yuklab olish: PLAY bosilganda internet sekin bo'lsa ham video qotmaydi ---- */
let INTRO_URL = null;
function preloadIntro(){ if (INTRO_URL || window._preIntro) return; window._preIntro = 1;
  fetch("intro.mp4").then(async r => { if (!r.ok || !r.body) throw 0; const total = +r.headers.get("content-length") || 0, rd = r.body.getReader(), parts = []; let got = 0;
    for (;;) { const {done, value} = await rd.read(); if (done) break; parts.push(value); got += value.length; const el = $("#vpre"); if (el && total) el.textContent = "🎬 " + Math.round(got/total*100) + "%"; }
    INTRO_URL = URL.createObjectURL(new Blob(parts, {type:"video/mp4"})); const el = $("#vpre"); if (el) el.textContent = "🎬 ✓";
    const v = $("#iv"); if (v && v.paused && v.currentTime < .1) v.src = INTRO_URL; preloadRest(); })
  .catch(() => { window._preIntro = 0; setTimeout(preloadIntro, 5000); }); }
// video tayyor bo'lgach: musiqa fayllari va Excel kutubxonasi ham oldindan yuklanadi (dars oxirigacha internet uzilsa ham ishlaydi)
const PRE = {};
function preloadRest(){ ["intro_outro.mp3","intro_soft.mp3"].forEach(f => { if (PRE[f]) return; fetch(f).then(r => r.ok ? r.blob() : Promise.reject()).then(b => { PRE[f] = URL.createObjectURL(b); }).catch(()=>{}); });
  try { loadXLSX().catch(()=>{}); } catch(e) {} }
function copyLink(btn){ const u = joinURL(); const done = () => { if (btn) { btn.textContent = "✓ Nusxalandi — Telegramga joylang"; setTimeout(()=>btn.textContent="📋 Linkni nusxalash", 2500); } };
  try { navigator.clipboard.writeText(u).then(done, () => { prompt("Link:", u); }); } catch(e) { prompt("Link:", u); } }
// zaxira: internet juda sekin bo'lsa — V tugmasi bilan videoni noutbukdagi fayldan tanlash
function pickLocalVideo(){ const i = document.createElement("input"); i.type = "file"; i.accept = "video/mp4,video/*";
  i.onchange = () => { const f = i.files && i.files[0]; if (!f) return; INTRO_URL = URL.createObjectURL(f); const el = $("#vpre"); if (el) el.textContent = "🎬 ✓ (fayl)"; const v = $("#iv"); if (v && v.paused) v.src = INTRO_URL; }; i.click(); }
function startHost() { preloadIntro();
  ensureHostRoom(); bgMarket(); bgEmbers();
  document.documentElement.classList.add("host");
  addEventListener("keydown", e => { if (e.target.tagName === "INPUT" || !hostOwner) return; const K = /^Key[A-Z]$/.test(e.code||"") ? e.code.slice(3).toLowerCase() : (e.key||"").toLowerCase();
    if (["ArrowRight","PageDown"," ","Enter","ArrowDown"].includes(e.key)) { e.preventDefault(); hostNext(); }
    else if (["ArrowLeft","PageUp","ArrowUp"].includes(e.key)) { e.preventDefault(); hostPrev(); }
    else if (K === "m") { e.preventDefault(); toggleMute(); }
    else if (K === "e") { e.preventDefault(); exportReport(); }
    else if (K === "v") { e.preventDefault(); pickLocalVideo(); }
    else if (K === "l") { e.preventDefault(); copyLink(); }
    else if (K === "u") { e.preventDefault(); LANGMODE = LANGMODE ? 0 : 1; try { localStorage.setItem("fbz_lang", LANGMODE); } catch(e) {} hostSig = ""; hostRender(R);
      const h=document.createElement("div"); h.textContent = LANGMODE ? "O‘zbekcha katta · Uzbek big" : "Aralash · Mixed (EN atamalar katta)"; h.style.cssText="position:fixed;left:50%;top:2rem;transform:translateX(-50%);z-index:99;background:rgba(0,0,0,.8);color:#fff;padding:.7rem 1.2rem;border-radius:8px;font:700 18px sans-serif"; document.body.appendChild(h); setTimeout(()=>h.remove(),1800); }
    else if (e.key === "2") { e.preventDefault(); const on = !(R.state||{}).r2; setState({...(R.state||{}), r2: on}); const h=document.createElement("div"); h.textContent = on ? "Round 2 ON · 2-raund yoqildi" : "Round 2 OFF · 2-raund o‘chirildi"; h.style.cssText="position:fixed;left:50%;top:2rem;transform:translateX(-50%);z-index:99;background:rgba(0,0,0,.8);color:#fff;padding:.7rem 1.2rem;border-radius:8px;font:700 18px sans-serif"; document.body.appendChild(h); setTimeout(()=>h.remove(),1800); }
    else if (K === "q" || (e.key === "Escape" && $("#bigqr"))) { e.preventDefault(); if (e.key !== "Escape" || $("#bigqr")) bigQR(); }
    else if (e.key === "F5") { e.preventDefault(); if (!document.fullscreenElement) document.documentElement.requestFullscreen?.(); }   // pult "start" tugmasi sahifani yangilamasin
    else if (K === "b" || e.key === "." || e.code === "Period" || K === "w") { e.preventDefault(); const k=$("#blackout"); if (k) k.remove(); else { const d=document.createElement("div"); d.id="blackout"; d.style.cssText="position:fixed;inset:0;background:#000;z-index:99"; d.onclick=()=>d.remove(); document.body.appendChild(d); } }
  });
  const wake = () => { ac(); const c = cur(R.state||{}); if (c.s.id === "join") startHeart(); }; ["pointerdown","keydown"].forEach(ev => addEventListener(ev, wake, {once:true}));
  claimHost(); setInterval(() => { if (hostOwner) Store.set("hostDev", {id: HDEV, t: Store.now()}); }, 10000);
  Store.on("hostDev", d => { if (!d || !d.id || d.id === HDEV || !hostOwner) return; hostOwner = false; hostLockOv(); });
  let init = false;
  Store.on("", room => { if (!IS_HOST) return; if (!init) { init = true; if (!room || !room.state || room.state.slide == null) { Store.set("state", {slide:0}); return; } } hostRender(room); });
}
/* ---- boshlovchi: faqat PIN bilan; xonani bir vaqtda faqat bitta qurilma boshqaradi ---- */
function beHost() { IS_HOST = true; startHost(); }
function hostGate(msg) { document.documentElement.classList.add("host");
  app.innerHTML = `<div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#0b0806;color:#f6f2ea;font-family:sans-serif;z-index:50">
    <div style="font-size:54px">🔐</div><div style="font-size:30px;font-weight:800">Presenter · Boshlovchi</div><div style="font-size:18px;opacity:.75">PIN kodni kiriting</div>
    <input id="hpin" type="password" inputmode="numeric" maxlength="12" autocomplete="off" style="font:700 34px monospace;letter-spacing:.3em;text-align:center;width:260px;padding:12px;border-radius:12px;border:2px solid var(--gold);background:#16110c;color:#fff">
    <button id="hgo" style="font:800 22px sans-serif;padding:12px 40px;border-radius:12px;border:0;background:var(--gold);color:#111;cursor:pointer">OK</button>
    <div id="hmsg" style="min-height:24px;color:#ff7a6b;font-weight:700">${msg||""}</div></div>`;
  const go = () => hostUnlock($("#hpin").value).then(ok => ok ? beHost() : ($("#hpin").value = "", $("#hmsg").textContent = "Noto‘g‘ri PIN · Wrong PIN"));
  $("#hgo").onclick = go; $("#hpin").addEventListener("keydown", e => { if (e.key === "Enter") go(); }); setTimeout(() => $("#hpin") && $("#hpin").focus(), 50); }
if (WANT_HOST) { if (!(window.crypto && crypto.subtle)) hostGate("⚠️ Saytni https:// orqali oching");
  else tryKey(lsx.getItem("fbz_hk")).then(ok => ok ? beHost() : hostGate()); }
else if (!ROOM) {
  app.innerHTML = joinView();
} else {
  Store.on("", playerRender);
}
</script>
